<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>LIMS Helpdesk Request Form</title>

    <style>
        :root {
            --navy: #002060;
            --navy-dark: #001640;
            --blue-light: #eaf2fb;
            --blue-soft: #f5f8fc;
            --white: #ffffff;
            --black: #141414;
            --border: #7f8c9a;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            margin: 0;
            background: #e9e9e9;
            font-family: Calibri, Arial, sans-serif;
            color: var(--black);
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            gap: 8px;
            align-items: center;

            padding: 10px 16px;

            background: #1c1c1c;
            color: #fff;

            font-size: 13px;
        }

        .toolbar button,
        .toolbar label.btn {
            background: #3a3a3a;
            color: #fff;

            border: 1px solid #555;

            padding: 6px 12px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 13px;
        }

        .toolbar button:hover,
        .toolbar label.btn:hover {
            background: #4a4a4a;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .toolbar .spacer {
            flex: 1;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .form-page {
            width: 612pt;
            min-height: 792pt;

            margin: 24px auto;
            padding: 40pt;

            background: #fff;

            box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);

            font-family: Calibri, Arial, sans-serif;
            font-size: 10pt;

            position: relative;
        }

        /* =========================================================
           GENERIC TABLE
        ========================================================= */

        table.form-table {
            width: 100%;

            border-collapse: collapse;

            border: 0.75pt solid var(--border);

            table-layout: fixed;
        }

        table.form-table td {
            border: 0.75pt solid var(--border);

            padding: 0;

            vertical-align: middle;

            overflow: hidden;
        }

        table.form-table .value-cell {
            background: var(--white);
        }

        table.form-table tr:nth-child(even) .value-cell {
            background: var(--blue-soft);
        }

        /* =========================================================
           LABEL CELL
        ========================================================= */

        .label-cell {
            background: var(--navy);
            color: var(--white);

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;
            font-weight: bold;

            padding: 3px 7px;

            line-height: 1.2;

            white-space: nowrap;

            vertical-align: middle;
        }

        .label-cell.light {
            background: var(--white);
            color: var(--black);
        }

        /* =========================================================
           VALUE / EDITABLE CELL
        ========================================================= */

        .value-cell {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            padding: 3px 7px;

            line-height: 1.2;

            outline: none;
        }

        .value-cell.center {
            text-align: center;
        }

        .value-cell[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        table.form-table .value-cell {
            color: #1f2937;
        }

        /* =========================================================
           SECTION BAR
        ========================================================= */

        .section-bar {
            background: var(--navy);

            color: var(--white);

            font-family: Calibri, Arial, sans-serif;

            font-weight: bold;

            font-size: 10pt;

            padding: 3px 7px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border: 0.75pt solid var(--border);

            border-bottom: none;
        }

        .section-bar.small {
            font-size: 10pt;
        }

        /* DETAILED OF ACTION - match RESOLUTION section-bar borders */
        .action-details-bar {
            margin-top: 0 !important;
            border-top: 0.75pt solid var(--border) !important;
            border-left: 0.75pt solid var(--border) !important;
            border-right: 0.75pt solid var(--border) !important;
            border-bottom: none !important;
            width: 100%;
        }

        /* Keep the action details text aligned with the other tables */
        .action-details-box .text-area {
            padding-left: 10px;
            padding-right: 10px;
        }

        .section-bar.centered {
            justify-content: center;

            text-align: center;
        }

        /* =========================================================
           TEXT BOXES
        ========================================================= */

        .text-box {
            display: flex;

            border: 0.75pt solid var(--border);

            border-top: none;
        }

        .text-box .text-area {
            flex: 1;

            padding: 3px 7px;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            line-height: 1.2;

            outline: none;

            white-space: pre-wrap;

            overflow: auto;
        }

        .text-box .text-area[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        .desc-box {
            height: 46pt;
        }

        .remarks-box {
            height: 34pt;
        }

        .final-box {
            height: 34pt;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header-table {
            width: 100%;

            border-collapse: collapse;

            border: 1px solid #000;

            table-layout: fixed;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;
        }

        .header-table td {
            border: 1px solid var(--border);

            padding: 0;

            vertical-align: middle;

            overflow: hidden;

            white-space: nowrap;
        }

        .header-table .title-agency,
        .header-table .title-form {
            background: var(--blue-soft);
        }

        .header-table .ref-label {
            background: var(--blue-light);
            color: var(--navy-dark);
        }

        .header-table .ref-value {
            background: var(--white);
        }

        /* =========================================================
           HEADER COLUMNS
        ========================================================= */

        .header-logo-col {
            width: 15%;
        }

        .header-title-col {
            width: 45%;
        }

        .header-ref-label-1 {
            width: 10%;
        }

        .header-ref-label-2 {
            width: 7%;
        }

        .header-ref-value-1 {
            width: 10%;
        }

        .header-ref-value-2 {
            width: 13%;
        }

        /* =========================================================
           HEADER LOGO
        ========================================================= */

        .logo-cell {
            text-align: center;

            padding: 2pt !important;
        }

        .logo-cell img {
            max-width: 58pt;

            max-height: 58pt;

            display: block;

            margin: 0 auto;
        }

        /* =========================================================
           HEADER TITLE
        ========================================================= */

        .title-cell {
            text-align: center;

            padding: 2pt 4pt !important;
        }

        .title-agency {
            font-size: 9.5pt;

            font-weight: bold;

            color: var(--navy);
        }

        .title-form {
            font-size: 11pt;

            font-weight: bold;

            color: var(--navy);

            margin-top: 2pt;
        }

        /* =========================================================
           HEADER REF / META
        ========================================================= */

        .ref-label {
            font-size: 8.5pt;

            font-weight: bold;

            padding: 2pt 4pt !important;
        }

        .ref-value {
            font-size: 8.5pt;

            padding: 2pt 4pt !important;

            outline: none;
        }

        .ref-value.center {
            text-align: center;

            padding: 0 !important;
        }

        .ref-value[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        /* =========================================================
           META
        ========================================================= */

        .meta-table {
            margin-top: 8pt;
        }

        /* =========================================================
           TOP META INNER SPACING
        ========================================================= */

        .meta-table .label-cell,
        .form-table .label-cell {
            padding-left: 10px;
            padding-right: 10px;
        }

        .meta-table .value-cell,
        .form-table .value-cell {
            padding-left: 10px;
            padding-right: 10px;
        }

        .section-gap {
            margin-top: 10pt;
        }

        /* =========================================================
           RESOLUTION
        ========================================================= */

        .resolution-row1 {
            height: 20pt;
        }

        .resolution-row2 {
            height: 20pt;
        }

        /* =========================================================
           APPROVAL
        ========================================================= */

        .approval-col {
            padding: 5pt 7pt;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            background: var(--blue-soft);

            vertical-align: top;
        }

        .approval-label {
            font-size: 10pt;

            font-weight: bold;

            margin-bottom: 20pt;

            color: var(--navy-dark);
        }

        .approval-name {
            font-size: 10pt;

            font-weight: bold;

            text-transform: uppercase;

            min-height: 14pt;

            outline: none;

            padding-left: 4px;

            color: #111827;
        }

        .approval-position {
            font-size: 9.5pt;

            font-weight: normal;

            font-style: italic;

            color: #374151;

            min-height: 12pt;

            margin-top: 2pt;

            outline: none;

            padding-left: 4px;
        }

        .approval-name[contenteditable="true"]:focus,
        .approval-position[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        .footer-cell {
            padding: 3px 7px;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: bold;

            outline: none;

            background: var(--blue-light);

            color: var(--navy-dark);
        }

        .footer-cell span[contenteditable="true"] {
            font-weight: normal;

            padding-left: 4px;
        }

        .footer-cell span[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        /* =========================================================
           PRINT
        ========================================================= */

        @media print {

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .toolbar {
                display: none;
            }

            body {
                background: #fff;
            }

            .form-page {
                margin: 0;

                box-shadow: none;
            }

            .form-page+.form-page {
                page-break-before: always;
            }

            @page {
                size: letter;

                margin: 0;
            }

            /* =====================================================
               PRINT DIALOG - BORDER ALIGNMENT FIX
            ===================================================== */
            .form-table,
            .end-user-details-table,
            .resolution-responsible-table {
                width: 100% !important;
                box-sizing: border-box !important;
            }

            .section-bar,
            .end-user-details-bar,
            .resolution-header,
            .action-details-bar,
            .final-remarks-header,
            .closing-approval-header {
                width: 100% !important;
                box-sizing: border-box !important;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">

        <button id="fill-sample-btn">Fill Sample Data</button>

        <button id="clear-btn">Clear</button>

        <label class="btn" for="logo-upload-1">Upload Logo</label>
        <input type="file" id="logo-upload-1" accept="image/*">

        <div class="spacer"></div>

        <button id="print-btn">Print / Save as PDF</button>

    </div>


    <template id="lims-ticket-template">

        <div class="form-page">

            <!-- =====================================================
                 HEADER
            ===================================================== -->

            <table class="header-table">

                <colgroup>

                    <col class="header-logo-col">

                    <col class="header-title-col">

                    <col class="header-ref-label-1">

                    <col class="header-ref-value-1">

                    <col class="header-ref-label-2">

                    <col class="header-ref-value-2">

                </colgroup>


                <tr>

                    <!-- LOGO -->

                    <td rowspan="4" class="logo-cell">

                        <img data-role="logo-img-1" src="./BSWM_LOGO.png" alt="BSWM Logo">

                    </td>


                    <!-- AGENCY TITLE -->

                    <td class="title-cell title-agency">

                        BUREAU OF SOILS AND WATER MANAGEMENT

                    </td>


                    <!-- REF CODE -->

                    <td class="ref-label">
                        Reference Code:
                    </td>

                    <td colspan="3" class="ref-value" data-field="REF_CODE" contenteditable="true">
                        BSWM_LS_FR_0140
                    </td>

                </tr>


                <tr>

                    <!-- FORM TITLE -->

                    <td rowspan="3" class="title-cell title-form">

                        SERVICE REQUEST TICKET

                    </td>


                    <!-- EFFECTIVE DATE -->

                    <td class="ref-label">
                        Effective Date:
                    </td>

                    <td colspan="3" class="ref-value" data-field="EFFECTIVE_DATE" contenteditable="true">
                        September 12, 2025
                    </td>

                </tr>


                <tr>

                    <!-- REVISION NO -->

                    <td class="ref-label">
                        Revision No.:
                    </td>

                    <td class="ref-value center" data-field="REV_NO" contenteditable="true">
                        1
                    </td>


                    <!-- PAGE NO -->

                    <td class="ref-label">
                        Page No.:
                    </td>

                    <td class="ref-value center" data-field="PAGE_NO" contenteditable="true">
                        1 of 1
                    </td>

                </tr>


                <tr>

                    <!-- EMPTY FILLER ROW FOR HEADER BORDER -->

                    <td class="ref-label" style="height:12pt;"></td>

                    <td class="ref-value"></td>

                    <td class="ref-label"></td>

                    <td class="ref-value"></td>

                </tr>

            </table>


            <!-- =====================================================
                 TOP META
            ===================================================== -->

            <table class="form-table meta-table">

                <colgroup>

                    <col style="width:130pt;">

                    <col style="width:136pt;">

                    <col style="width:130pt;">

                    <col style="width:136pt;">

                </colgroup>


                <!-- ISSUE & TICKET NO -->

                <tr style="height:20pt;">

                    <td class="label-cell">
                        ISSUE:
                    </td>

                    <td class="value-cell" data-field="ISSUE" contenteditable="true"></td>

                    <td class="label-cell">
                        TICKET NO.:
                    </td>

                    <td class="value-cell" data-field="TICKET_ID" contenteditable="true"></td>

                </tr>


                <!-- STATUS & DATE SUBMITTED -->

                <tr style="height:20pt;">

                    <td class="label-cell">
                        TICKET STATUS:
                    </td>

                    <td class="value-cell" data-field="NEW_STATUS" contenteditable="true"></td>

                    <td class="label-cell">
                        DATE SUBMITTED:
                    </td>

                    <td class="value-cell" data-field="DATE_CREATED" contenteditable="true"></td>

                </tr>


                <!-- URGENCY & TARGET RESOLUTION -->

                <tr style="height:20pt;">

                    <td class="label-cell">
                        URGENCY LEVEL:
                    </td>

                    <td class="value-cell" data-field="URGENCY_LEVEL" contenteditable="true"></td>

                    <td class="label-cell">
                        RESOLUTION TARGET:
                    </td>

                    <td class="value-cell" data-field="TARGET_RESOLUTION" contenteditable="true"></td>

                </tr>

            </table>


            <!-- =====================================================
                 END USER DETAILS
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar end-user-details-bar">
                    END USER DETAILS
                </div>


                <table class="form-table end-user-details-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:130pt;">

                        <col style="width:402pt;">

                    </colgroup>


                    <!-- REQUESTED BY -->

                    <tr style="height:20pt;">

                        <td class="label-cell light">
                            REQUESTED BY:
                        </td>

                        <td class="value-cell" data-field="REQUESTED_BY" contenteditable="true"></td>

                    </tr>


                    <!-- EMAIL -->

                    <tr style="height:20pt;">

                        <td class="label-cell light">
                            EMAIL ADDRESS:
                        </td>

                        <td class="value-cell" data-field="EMAIL" contenteditable="true"></td>

                    </tr>


                    <!-- FULL NAME -->

                    <tr style="height:20pt;">

                        <td class="label-cell light">
                            FULL NAME:
                        </td>

                        <td class="value-cell" data-field="FULL_NAME" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- DESCRIPTION -->

                <div class="section-bar small" style="margin-top:0;border-top:none;">
                    <span>
                        DESCRIPTION/DETAILS OF THE REQUIREMENT
                    </span>
                </div>


                <div class="text-box desc-box">

                    <div class="text-area" data-field="PLEASE_SPECIFY" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 RESOLUTION
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar resolution-header">
                    RESOLUTION
                </div>


                <!-- RESPONSIBLE PERSON -->

                <table class="form-table resolution-responsible-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:130pt;">

                        <col style="width:402pt;">

                    </colgroup>


                    <tr class="resolution-row1">

                        <td class="label-cell light">
                            RESPONSIBLE PERSON:
                        </td>

                        <td class="value-cell" data-field="ASSIGNED_TO" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- DATES -->

                <table class="form-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:130pt;">

                        <col style="width:136pt;">

                        <col style="width:130pt;">

                        <col style="width:136pt;">

                    </colgroup>


                    <tr class="resolution-row2">

                        <td class="label-cell light">
                            DATE OF ACTION:
                        </td>

                        <td class="value-cell" data-field="DATE_ACTION" contenteditable="true"></td>

                        <td class="label-cell light">
                            DATE CLOSE:
                        </td>

                        <td class="value-cell" data-field="DATE_CLOSE" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- ACTION DETAILS -->

                <div class="section-bar small action-details-bar">
                    DETAILED OF ACTION
                </div>


                <div class="text-box remarks-box action-details-box">

                    <div class="text-area" data-field="RESOLUTION_REMARKS" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 FINAL REMARKS
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar centered final-remarks-header">
                    FINAL REMARKS
                </div>


                <div class="text-box final-box">

                    <div class="text-area" data-field="FINAL_REMARKS" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 CLOSING APPROVAL
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar centered closing-approval-header">
                    SERVICE REQUEST TICKET CLOSING APPROVAL
                </div>


                <table class="form-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:50%;">

                        <col style="width:50%;">

                    </colgroup>


                    <tr>

                        <!-- TROUBLESHOOT BY -->

                        <td class="approval-col">

                            <div class="approval-label">
                                TROUBLESHOOT BY:
                            </div>


                            <div class="approval-name" data-field="ASSIGNED_TO" contenteditable="true"></div>


                            <div class="approval-position" data-field="POSITION" contenteditable="true"></div>

                        </td>


                        <!-- APPROVED BY -->

                        <td class="approval-col">

                            <div class="approval-label">
                                APPROVED BY:
                            </div>


                            <div class="approval-name" data-field="APPROVED_BY" contenteditable="true"></div>


                            <div class="approval-position" data-field="APPROVED_POSITION" contenteditable="true"></div>

                        </td>

                    </tr>

                </table>

            </div>

        </div>

    </template>


    <!-- =========================================================
         FORM CONTAINER
    ========================================================= -->

    <div id="form-container"></div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>
        (function () {
            const FIELD_KEYS = [
                'ISSUE',
                'TICKET_ID',
                'DATE_CREATED',
                'NEW_STATUS',
                'URGENCY_LEVEL',
                'TARGET_RESOLUTION',

                'REQUESTED_BY',
                'OFFICE',
                'EMAIL',
                'FULL_NAME',

                'PLEASE_SPECIFY',

                'ASSIGNED_TO',
                'DATE_ACTION',
                'DATE_CLOSE',

                'RESOLUTION_REMARKS',
                'FINAL_REMARKS',

                'POSITION',

                'APPROVED_BY',
                'APPROVED_POSITION',

                'DATE_CLOSED',
                'CLOSED_DATE',

                'REF_CODE',
                'EFFECTIVE_DATE',
                'REV_NO',
                'PAGE_NO',
            ];

            function fillFields(root, data) {
                FIELD_KEYS.forEach(key => {
                    if (!(key in data)) return;
                    root.querySelectorAll(`[data-field="${key}"]`).forEach(el => {
                        el.textContent = data[key] == null ? '' : String(data[key]);
                    });
                });
            }

            function setLogo(root, src) {
                const img = root.querySelector('[data-role="logo-img-1"]');
                if (!img) return;
                img.src = src || './BSWM_LOGO.png';
            }

            function cloneForm() {
                const tpl = document.getElementById('lims-ticket-template');
                return tpl.content.firstElementChild.cloneNode(true);
            }

            window.LimsTicketForm = {
                FIELD_KEYS,
                fillFields,
                setLogo,
                cloneForm,
            };

            const container = document.getElementById('form-container');
            const formNode = cloneForm();
            container.appendChild(formNode);

            document.getElementById('logo-upload-1').addEventListener('change', e => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => setLogo(formNode, reader.result);
                reader.readAsDataURL(file);
            });

            document.getElementById('fill-sample-btn').addEventListener('click', () => {
                fillFields(formNode, {
                    ISSUE: 'Unable to print sample results',
                    TICKET_ID: 'TCK-2026-0142',
                    DATE_CREATED: 'August 10, 2026',
                    NEW_STATUS: 'In Progress',
                    URGENCY_LEVEL: 'High',
                    TARGET_RESOLUTION: 'August 13, 2026',
                    REQUESTED_BY: 'Juan Dela Cruz',
                    OFFICE: 'Soil Chemistry Section',
                    EMAIL: 'jdelacruz@bswm.da.gov.ph',
                    FULL_NAME: 'Juan P. Dela Cruz',
                    PLEASE_SPECIFY: 'LIMS print job for batch #2026-118 fails at the print-preview step; error dialog references the reporting module.',
                    ASSIGNED_TO: 'Maria Santos',
                    DATE_ACTION: 'August 11, 2026',
                    DATE_CLOSE: '',
                    RESOLUTION_REMARKS: 'Reinstalled the reporting module driver and cleared the print spooler cache; issue no longer reproduces.',
                    FINAL_REMARKS: 'Monitored for 24 hours, no recurrence reported.',
                    POSITION: 'IT Support Officer',
                    APPROVED_BY: 'Engr. Ana Reyes',
                    APPROVED_POSITION: 'Laboratory Chief',
                    DATE_CLOSED: '',
                    CLOSED_DATE: '',
                    REF_CODE: 'BSWM_LS_FR_0140',
                    EFFECTIVE_DATE: 'September 12, 2025',
                    REV_NO: '1',
                    PAGE_NO: '1 of 1',
                });
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                const cleared = {};
                FIELD_KEYS.forEach(key => { cleared[key] = ''; });
                fillFields(formNode, cleared);
                setLogo(formNode, './BSWM_LOGO.png');
            });

            document.getElementById('print-btn').addEventListener('click', () => {
                window.print();
            });
        })();
    </script>
</body>

</html>
