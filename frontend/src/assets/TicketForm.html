<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LIMS Helpdesk Request Form</title>

    <style>
        :root {
            --navy: #002060;
            --white: #ffffff;
            --black: #141414;
            --border: #262626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e9e9e9;
            font-family: Calibri, Arial, sans-serif;
            color: var(--black);
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            gap: 8px;
            align-items: center;

            padding: 10px 16px;

            background: #1c1c1c;
            color: #fff;

            font-size: 13px;
        }

        .toolbar button,
        .toolbar label.btn {
            background: #3a3a3a;
            color: #fff;

            border: 1px solid #555;

            padding: 6px 12px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 13px;
        }

        .toolbar button:hover,
        .toolbar label.btn:hover {
            background: #4a4a4a;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .toolbar .spacer {
            flex: 1;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .form-page {
            width: 612pt;
            min-height: 792pt;

            margin: 24px auto;
            padding: 40pt;

            background: #fff;

            box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);

            font-family: Calibri, Arial, sans-serif;
            font-size: 10pt;

            position: relative;
        }

        /* =========================================================
           GENERIC TABLE
        ========================================================= */

        table.form-table {
            width: 100%;

            border-collapse: collapse;

            border: 0.75pt solid var(--border);

            table-layout: fixed;
        }

        table.form-table td {
            border: 0.75pt solid var(--border);

            padding: 0;

            vertical-align: middle;

            overflow: hidden;
        }

        /* =========================================================
           LABEL CELL
        ========================================================= */

        .label-cell {
            background: var(--navy);
            color: var(--white);

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;
            font-weight: bold;

            padding: 5px 7px;

            line-height: 1.2;

            white-space: nowrap;

            vertical-align: middle;
        }

        /* =========================================================
           VALUE / EDITABLE CELL
        ========================================================= */

        .value-cell {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            padding: 5px 10px;

            line-height: 1.2;

            outline: none;
        }

        .value-cell.center {
            text-align: center;
        }

        .value-cell[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        /* =========================================================
           SECTION BAR
        ========================================================= */

        .section-bar {
            background: var(--navy);

            color: var(--white);

            font-family: Calibri, Arial, sans-serif;

            font-weight: bold;

            font-size: 10pt;

            padding: 5pt 7pt;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border: 0.75pt solid var(--border);

            border-bottom: none;
        }

        .section-bar.small {
            font-size: 10pt;
        }

        .section-bar.centered {
            justify-content: center;

            text-align: center;
        }

        /* =========================================================
           TEXT BOXES
        ========================================================= */

        .text-box {
            display: flex;

            border: 0.75pt solid var(--border);

            border-top: none;
        }

        .text-box .text-area {
            flex: 1;

            padding: 5pt 10px;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            line-height: 1.2;

            outline: none;

            white-space: pre-wrap;

            overflow: auto;
        }

        .text-box .text-area[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        .desc-box {
            height: 46pt;
        }

        .remarks-box {
            height: 34pt;
        }

        .final-box {
            height: 34pt;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header-table {
            width: 100%;

            border-collapse: collapse;

            border: 1px solid #000;

            table-layout: fixed;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;
        }

        .header-table td {
            border: 1px solid #000;

            padding: 0;

            vertical-align: middle;

            overflow: hidden;

            white-space: nowrap;
        }

        /* =========================================================
           HEADER COLUMNS
        ========================================================= */

        .header-logo-col {
            width: 15%;
        }

        .header-title-col {
            width: 45%;
        }

        .header-ref-label-1 {
            width: 10%;
        }

        .header-ref-label-2 {
            width: 7%;
        }

        .header-ref-value-1 {
            width: 10%;
        }

        .header-ref-value-2 {
            width: 13%;
        }

        /* =========================================================
           HEADER LOGO
        ========================================================= */

        .logo-cell {
            text-align: center;

            padding: 2px !important;

            vertical-align: middle !important;
        }

        .logo-slot {
            width: 100%;

            height: 76pt;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .logo-circle {
            width: 100%;

            height: 76pt;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }

        .logo-circle img {
            width: 100%;

            height: 100%;

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;

            display: block;
        }

        /* =========================================================
           HEADER AGENCY
        ========================================================= */

        .title-agency {
            height: 32pt;

            text-align: center;

            padding: 0 5px !important;
        }

        .agency-name {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: bold;

            line-height: 1;

            white-space: nowrap;
        }

        .agency-division {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: bold;

            line-height: 1;

            margin-top: 3px;

            white-space: nowrap;
        }

        /* =========================================================
           FORM TITLE
        ========================================================= */

        .title-form {
            height: 32pt;

            text-align: center;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: bold;

            padding: 0 5px !important;

            white-space: nowrap;
        }

        /* =========================================================
           HEADER REFERENCE LABEL
        ========================================================= */

        .ref-label {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: normal;

            padding: 0 6px !important;

            text-align: left;

            white-space: nowrap;
        }

        /* =========================================================
           HEADER REFERENCE VALUE
        ========================================================= */

        .ref-value {
            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: normal;

            padding: 0 5px !important;

            text-align: center;

            white-space: nowrap;

            outline: none;
        }

        .ref-value.large {
            font-size: 10pt;

            font-weight: bold;
        }

        .ref-value.center {
            text-align: center;

            padding: 0 !important;
        }

        .ref-value[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        /* =========================================================
           META
        ========================================================= */

        .meta-table {
            margin-top: 8pt;
        }

        .section-gap {
            margin-top: 10pt;
        }

        /* =========================================================
           RESOLUTION
        ========================================================= */

        .resolution-row1 {
            height: 20pt;
        }

        .resolution-row2 {
            height: 20pt;
        }

        /* =========================================================
           APPROVAL
        ========================================================= */

        .approval-outer {
            border: 0.75pt solid var(--border);

            border-top: none;
        }

        .approval-box {
            display: flex;

            border-bottom: 0.75pt solid var(--border);

            min-height: 59pt;
        }

        .approval-col {
            flex: 1;

            padding: 6pt 10px;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;
        }

        .approval-col.left {
            border-right: 0.75pt solid var(--border);
        }

        .approval-label {
            font-size: 10pt;

            font-weight: bold;

            margin-bottom: 20pt;
        }

        .approval-name {
            font-size: 10pt;

            min-height: 11pt;

            outline: none;

            padding-left: 4px;
        }

        .approval-position {
            font-size: 10pt;

            min-height: 10pt;

            margin-top: 1pt;

            outline: none;

            padding-left: 4px;
        }

        .approval-name[contenteditable="true"]:focus,
        .approval-position[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        .approval-footer {
            display: flex;
        }

        .footer-cell {
            flex: 1;

            padding: 4pt 10px;

            font-family: Calibri, Arial, sans-serif;

            font-size: 10pt;

            font-weight: bold;

            outline: none;
        }

        .footer-cell.left {
            border-right: 0.75pt solid var(--border);
        }

        .footer-cell span[contenteditable="true"] {
            font-weight: normal;

            padding-left: 4px;
        }

        .footer-cell span[contenteditable="true"]:focus {
            background: #fffbdd;
        }

        /* =========================================================
           PRINT
        ========================================================= */

        @media print {

            .toolbar {
                display: none;
            }

            body {
                background: #fff;
            }

            .form-page {
                margin: 0;

                box-shadow: none;
            }

            .form-page+.form-page {
                page-break-before: always;
            }

            @page {
                size: letter;

                margin: 0;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================================
         TOOLBAR
    ========================================================= -->

    <div class="toolbar no-print">

        <label class="btn" for="logo-upload-1">
            Upload Logo
        </label>

        <input id="logo-upload-1" type="file" accept="image/*">

        <button id="fill-sample-btn">
            Fill Sample Data
        </button>

        <button id="clear-btn">
            Clear Fields
        </button>

        <div class="spacer"></div>

        <button id="print-btn">
            Print / Save as PDF
        </button>

    </div>


    <!-- =========================================================
         FORM TEMPLATE
    ========================================================= -->

    <template id="lims-ticket-template">

        <div class="form-page">

            <!-- =====================================================
                 HEADER
            ===================================================== -->

            <table class="header-table">

                <colgroup>

                    <col class="header-logo-col">

                    <col class="header-title-col">

                    <col class="header-ref-label-1">

                    <col class="header-ref-label-2">

                    <col class="header-ref-value-1">

                    <col class="header-ref-value-2">

                </colgroup>


                <!-- =================================================
                     ROW 1
                ================================================= -->

                <tr>

                    <!-- LOGO -->

                    <td class="logo-cell" rowspan="3">

                        <div class="logo-slot">

                            <div class="logo-circle" data-role="logo-circle-1">

                                <img data-role="logo-img-1" src="./BSWM_LOGO.png"
                                    alt="Department of Agriculture / BSWM logo">

                            </div>

                        </div>

                    </td>


                    <!-- AGENCY -->

                    <td class="title-agency">

                        <div class="agency-name">
                            BUREAU OF SOILS AND WATER MANAGEMENT
                        </div>

                        <div class="agency-division">
                            Laboratory Services Division
                        </div>

                    </td>


                    <!-- REFERENCE CODE -->

                    <td class="ref-label" colspan="2">
                        Reference Code:
                    </td>


                    <td class="ref-value large" colspan="2" data-field="REF_CODE" contenteditable="true">
                        BSWM_LS_FR_0140
                    </td>

                </tr>


                <!-- =================================================
                     ROW 2
                ================================================= -->

                <tr>

                    <!-- FORM TITLE -->

                    <td class="title-form" rowspan="2">
                        LIMS HELPDESK REQUEST FORM
                    </td>


                    <!-- EFFECTIVE DATE -->

                    <td class="ref-label" colspan="2">
                        Effective date:
                    </td>


                    <td class="ref-value large" colspan="2" data-field="EFFECTIVE_DATE" contenteditable="true">
                        September 12, 2025
                    </td>

                </tr>


                <!-- =================================================
                     ROW 3
                ================================================= -->

                <tr>

                    <!-- REVISION -->

                    <td class="ref-label">
                        Rev. No.
                    </td>

                    <td class="ref-value center" data-field="REV_NO" contenteditable="true">
                        1
                    </td>


                    <!-- PAGE -->

                    <td class="ref-label">
                        Page No.:
                    </td>

                    <td class="ref-value center" data-field="PAGE_NO" contenteditable="true">
                        1 of 1
                    </td>

                </tr>

            </table>


            <!-- =====================================================
                 TOP META
            ===================================================== -->

            <div>

                <table class="form-table meta-table">

                    <colgroup>

                        <col style="width:108pt;">

                        <col style="width:158pt;">

                        <col style="width:118pt;">

                        <col style="width:148pt;">

                    </colgroup>


                    <!-- ISSUE -->

                    <tr style="height:20pt;">

                        <td class="label-cell">
                            ISSUE:
                        </td>

                        <td class="value-cell" colspan="3" data-field="ISSUE" contenteditable="true"></td>

                    </tr>


                    <!-- TICKET NUMBER -->

                    <tr style="height:20pt;">

                        <td class="label-cell">
                            TICKET NO:
                        </td>

                        <td class="value-cell" data-field="TICKET_ID" contenteditable="true"></td>

                        <td class="label-cell">
                            DATA SUBMITTED:
                        </td>

                        <td class="value-cell" rowspan="2" data-field="DATE_CREATED" contenteditable="true"></td>

                    </tr>


                    <!-- STATUS -->

                    <tr style="height:20pt;">

                        <td class="label-cell">
                            TICKET STATUS:
                        </td>

                        <td class="value-cell" colspan="2" data-field="NEW_STATUS" contenteditable="true"></td>

                    </tr>


                    <!-- URGENCY -->

                    <tr style="height:20pt;">

                        <td class="label-cell">
                            URGENCY LEVEL:
                        </td>

                        <td class="value-cell" data-field="URGENCY_LEVEL" contenteditable="true"></td>

                        <td class="label-cell">
                            RESOLUTION TARGET:
                        </td>

                        <td class="value-cell" data-field="TARGET_RESOLUTION" contenteditable="true"></td>

                    </tr>

                </table>

            </div>


            <!-- =====================================================
                 END USER DETAILS
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar">
                    END USER DETAILS
                </div>


                <table class="form-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:150pt;">

                        <col>

                    </colgroup>


                    <!-- REQUESTED BY -->

                    <tr style="height:20pt;">

                        <td class="label-cell" style="background:none;color:var(--black);">
                            REQUESTED BY:
                        </td>

                        <td class="value-cell" data-field="REQUESTED_BY" contenteditable="true"></td>

                    </tr>



                    <!-- EMAIL -->

                    <tr style="height:20pt;">

                        <td class="label-cell" style="background:none;color:var(--black);">
                            EMAIL ADDRESS:
                        </td>

                        <td class="value-cell" data-field="EMAIL" contenteditable="true"></td>

                    </tr>


                    <!-- FULL NAME -->

                    <tr style="height:20pt;">

                        <td class="label-cell" style="background:none;color:var(--black);">
                            FULL NAME:
                        </td>

                        <td class="value-cell" data-field="FULL_NAME" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- DESCRIPTION -->

                <div class="section-bar small" style="margin-top:0;border-top:none;">
                    <span>
                        DESCRIPTION/DETAILS OF THE REQUIREMENT
                    </span>
                </div>


                <div class="text-box desc-box">

                    <div class="text-area" data-field="PLEASE_SPECIFY" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 RESOLUTION
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar">
                    RESOLUTION
                </div>


                <!-- RESPONSIBLE PERSON -->

                <table class="form-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:130pt;">

                        <col>

                    </colgroup>


                    <tr class="resolution-row1">

                        <td class="label-cell" style="background:none;color:var(--black);">
                            RESPONSIBLE PERSON:
                        </td>

                        <td class="value-cell" data-field="ASSIGNED_TO" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- DATES -->

                <table class="form-table" style="border-top:none;">

                    <colgroup>

                        <col style="width:100pt;">

                        <col style="width:166pt;">

                        <col style="width:80pt;">

                        <col style="width:186pt;">

                    </colgroup>


                    <tr class="resolution-row2">

                        <td class="label-cell" style="background:none;color:var(--black);">
                            DATE OF ACTION:
                        </td>

                        <td class="value-cell" data-field="DATE_ACTION" contenteditable="true"></td>

                        <td class="label-cell" style="background:none;color:var(--black);">
                            DATE CLOSE:
                        </td>

                        <td class="value-cell" data-field="DATE_CLOSE" contenteditable="true"></td>

                    </tr>

                </table>


                <!-- ACTION DETAILS -->

                <div class="section-bar small" style="margin-top:0;border-top:none;">
                    DETAILED OF ACTION
                </div>


                <div class="text-box remarks-box">

                    <div class="text-area" data-field="RESOLUTION_REMARKS" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 FINAL REMARKS
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar centered">
                    FINAL REMARKS
                </div>


                <div class="text-box final-box">

                    <div class="text-area" data-field="FINAL_REMARKS" contenteditable="true"></div>

                </div>

            </div>


            <!-- =====================================================
                 CLOSING APPROVAL
            ===================================================== -->

            <div class="section-gap">

                <div class="section-bar centered">
                    SERVICE REQUEST TICKET CLOSING APPROVAL
                </div>


                <div class="approval-outer">


                    <!-- APPROVAL PEOPLE -->

                    <div class="approval-box">


                        <!-- TROUBLESHOOT BY -->

                        <div class="approval-col left">

                            <div class="approval-label">
                                TROUBLESHOOT BY:
                            </div>


                            <div class="approval-name" data-field="ASSIGNED_TO" contenteditable="true"></div>


                            <div class="approval-position" data-field="POSITION" contenteditable="true"></div>

                        </div>


                        <!-- APPROVED BY -->

                        <div class="approval-col right">

                            <div class="approval-label">
                                APPROVED BY:
                            </div>


                            <div class="approval-name" data-field="APPROVED_BY" contenteditable="true"></div>


                            <div class="approval-position" data-field="APPROVED_POSITION" contenteditable="true"></div>

                        </div>

                    </div>


                    <!-- APPROVAL FOOTER -->

                    <div class="approval-footer">

                        <div class="footer-cell left">

                            APPROVAL DATE:

                            <span data-field="DATE_CLOSED" contenteditable="true"></span>

                        </div>


                        <div class="footer-cell">

                            CLOSED DATE:

                            <span data-field="CLOSED_DATE" contenteditable="true"></span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </template>


    <!-- =========================================================
         FORM CONTAINER
    ========================================================= -->

    <div id="form-container"></div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        (function () {

            const FIELD_KEYS = [

                'ISSUE',

                'TICKET_ID',

                'DATE_CREATED',

                'NEW_STATUS',

                'URGENCY_LEVEL',

                'TARGET_RESOLUTION',

                'REQUESTED_BY',

                'OFFICE',

                'EMAIL',

                'FULL_NAME',

                'PLEASE_SPECIFY',

                'ASSIGNED_TO',

                'DATE_ACTION',

                'DATE_CLOSE',

                'RESOLUTION_REMARKS',

                'FINAL_REMARKS',

                'POSITION',

                'APPROVED_BY',

                'APPROVED_POSITION',

                'DATE_CLOSED',

                'CLOSED_DATE',

                'REF_CODE',

                'EFFECTIVE_DATE',

                'REV_NO',

                'PAGE_NO'

            ];


            /* =====================================================
               FILL FIELDS
            ===================================================== */

            function fillFields(root, data) {

                FIELD_KEYS.forEach((key) => {

                    if (!(key in data)) {
                        return;
                    }

                    root
                        .querySelectorAll(
                            `[data-field="${key}"]`
                        )
                        .forEach((el) => {

                            el.textContent =
                                data[key] == null
                                    ? ''
                                    : String(data[key]);

                        });

                });

            }


            /* =====================================================
               SET LOGO
            ===================================================== */

            function setLogo(root, src) {

                const img =
                    root.querySelector(
                        '[data-role="logo-img-1"]'
                    );

                if (!img) {
                    return;
                }

                img.src =
                    src || './LOGO.png';

            }


            /* =====================================================
               CLONE FORM
            ===================================================== */

            function cloneForm() {

                const tpl =
                    document.getElementById(
                        'lims-ticket-template'
                    );

                return tpl
                    .content
                    .firstElementChild
                    .cloneNode(true);

            }


            /* =====================================================
               PUBLIC API
            ===================================================== */

            window.LimsTicketForm = {

                FIELD_KEYS,

                fillFields,

                setLogo,

                cloneForm

            };


            /* =====================================================
               CREATE FORM
            ===================================================== */

            const container =
                document.getElementById(
                    'form-container'
                );


            const formNode =
                cloneForm();


            container.appendChild(
                formNode
            );


            /* =====================================================
               LOGO UPLOAD
            ===================================================== */

            document
                .getElementById(
                    'logo-upload-1'
                )
                .addEventListener(
                    'change',
                    (e) => {

                        const file =
                            e.target.files &&
                            e.target.files[0];

                        if (!file) {
                            return;
                        }

                        const reader =
                            new FileReader();


                        reader.onload =
                            () => {

                                setLogo(
                                    formNode,
                                    reader.result
                                );

                            };


                        reader.readAsDataURL(
                            file
                        );

                    }
                );


            /* =====================================================
               SAMPLE DATA
            ===================================================== */

            document
                .getElementById(
                    'fill-sample-btn'
                )
                .addEventListener(
                    'click',
                    () => {

                        fillFields(
                            formNode,
                            {

                                ISSUE:
                                    'Unable to print sample results',

                                TICKET_ID:
                                    'TCK-2026-0142',

                                DATE_CREATED:
                                    'August 10, 2026',

                                NEW_STATUS:
                                    'In Progress',

                                URGENCY_LEVEL:
                                    'High',

                                TARGET_RESOLUTION:
                                    'August 13, 2026',

                                REQUESTED_BY:
                                    'Juan Dela Cruz',

                                OFFICE:
                                    'Soil Chemistry Section',

                                EMAIL:
                                    'jdelacruz@bswm.da.gov.ph',

                                FULL_NAME:
                                    'Juan P. Dela Cruz',

                                PLEASE_SPECIFY:
                                    'LIMS print job for batch #2026-118 fails at the print-preview step; error dialog references the reporting module.',

                                ASSIGNED_TO:
                                    'Maria Santos',

                                DATE_ACTION:
                                    'August 11, 2026',

                                DATE_CLOSE:
                                    '',

                                RESOLUTION_REMARKS:
                                    'Reinstalled the reporting module driver and cleared the print spooler cache; issue no longer reproduces.',

                                FINAL_REMARKS:
                                    'Monitored for 24 hours, no recurrence reported.',

                                POSITION:
                                    'IT Support Officer',
